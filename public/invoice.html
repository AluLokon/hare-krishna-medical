<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice — Sitaram Medical Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f7fa; min-height: 100vh; }

    .header {
      background: linear-gradient(135deg, #0f6b3a, #1a9b56);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header a { color: white; text-decoration: none; font-size: 20px; }
    .header-title { color: white; flex: 1; }
    .header-title strong { font-size: 17px; display: block; }
    .header-title span { font-size: 12px; opacity: 0.85; }
    .print-btn {
      background: white;
      color: #0f6b3a;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .container { max-width: 650px; margin: 24px auto; padding: 0 16px 40px; }

    .loading { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 15px; }
    .error-box { background: #fee2e2; color: #991b1b; padding: 16px; border-radius: 10px; text-align: center; }

    /* Invoice card */
    .invoice {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    .inv-header {
      background: linear-gradient(135deg, #0f6b3a, #1a9b56);
      padding: 28px 32px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .inv-logo-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .inv-logo-sub { font-size: 12px; opacity: 0.85; }
    .inv-logo-addr { font-size: 11px; opacity: 0.75; margin-top: 6px; line-height: 1.5; }
    .inv-title { text-align: right; }
    .inv-title h2 { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
    .inv-title .inv-num { font-size: 14px; opacity: 0.85; margin-top: 4px; }

    .inv-body { padding: 28px 32px; }

    .inv-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f3f4f6;
    }
    .meta-block label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
    .meta-block p { font-size: 14px; color: #1a1a2e; font-weight: 600; }
    .meta-block small { font-size: 12px; color: #6b7280; font-weight: 400; display: block; }

    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .inv-table th {
      background: #f8faf8;
      padding: 10px 12px;
      text-align: left;
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #e5e7eb;
    }
    .inv-table th:last-child, .inv-table td:last-child { text-align: right; }
    .inv-table td {
      padding: 12px;
      font-size: 13px;
      color: #374151;
      border-bottom: 1px solid #f3f4f6;
    }
    .inv-table tr:last-child td { border-bottom: none; }
    .inv-table .med-name { font-weight: 600; color: #1a1a2e; }
    .inv-table .med-brand { font-size: 11px; color: #9ca3af; }

    .inv-totals { display: flex; justify-content: flex-end; }
    .totals-box { width: 220px; }
    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      color: #6b7280;
      border-bottom: 1px solid #f3f4f6;
    }
    .total-row.grand {
      font-size: 16px;
      font-weight: 800;
      color: #0f6b3a;
      border-bottom: none;
      padding-top: 10px;
    }

    .inv-status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .status-pending    { background: #fef3c7; color: #92400e; }
    .status-confirmed  { background: #dbeafe; color: #1d4ed8; }
    .status-dispatched { background: #ede9fe; color: #6d28d9; }
    .status-delivered  { background: #d1fae5; color: #065f46; }
    .status-cancelled  { background: #fee2e2; color: #991b1b; }

    .inv-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px dashed #e5e7eb;
      text-align: center;
    }
    .inv-footer p { font-size: 12px; color: #9ca3af; line-height: 1.8; }
    .inv-footer strong { color: #374151; }

    .track-link {
      display: inline-block;
      margin-top: 16px;
      background: #0f6b3a;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    @media print {
      body { background: white; }
      .header, .print-btn { display: none !important; }
      .container { margin: 0; padding: 0; max-width: 100%; }
      .invoice { box-shadow: none; border-radius: 0; }
      .track-link { display: none; }
    }

    @media (max-width: 500px) {
      .inv-header { flex-direction: column; gap: 12px; }
      .inv-title { text-align: left; }
      .inv-body { padding: 20px 16px; }
      .inv-meta { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <a href="/">←</a>
  <div class="header-title">
    <strong>Invoice</strong>
    <span>Sitaram Medical Store</span>
  </div>
  <button class="print-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
</div>

<div class="container">
  <div id="content"><div class="loading">⏳ Loading invoice...</div></div>
</div>

<script>
const statusLabels = {
  pending:    { label: 'Order Placed',    cls: 'status-pending',    icon: '📋' },
  confirmed:  { label: 'Confirmed',        cls: 'status-confirmed',  icon: '✅' },
  dispatched: { label: 'Out for Delivery', cls: 'status-dispatched', icon: '🚚' },
  delivered:  { label: 'Delivered',        cls: 'status-delivered',  icon: '🏠' },
  cancelled:  { label: 'Cancelled',        cls: 'status-cancelled',  icon: '❌' }
};

async function loadInvoice() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const content = document.getElementById('content');

  if (!orderId) {
    content.innerHTML = '<div class="error-box">No order ID provided. Please go to <a href="/">home</a> and open your order.</div>';
    return;
  }

  try {
    const res = await fetch(`/api/orders/${orderId}`);
    if (!res.ok) {
      const err = await res.json();
      content.innerHTML = `<div class="error-box">${err.error || 'Order not found.'}</div>`;
      return;
    }
    const order = await res.json();
    renderInvoice(order);
  } catch (e) {
    content.innerHTML = '<div class="error-box">Network error. Please try again.</div>';
  }
}

function renderInvoice(order) {
  const content = document.getElementById('content');
  const items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]');
  const date = new Date(order.created_at).toLocaleDateString('en-IN', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
  const time = new Date(order.created_at).toLocaleTimeString('en-IN', {
    hour: '2-digit', minute: '2-digit'
  });
  const status = (order.status || 'pending').toLowerCase();
  const sc = statusLabels[status] || statusLabels.pending;

  const rows = items.map((i, idx) => `
    <tr>
      <td>${idx + 1}</td>
      <td>
        <div class="med-name">${i.name}</div>
        ${i.brand ? `<div class="med-brand">${i.brand}</div>` : ''}
      </td>
      <td style="text-align:center">${i.qty}</td>
      <td style="text-align:right">₹${parseFloat(i.price).toFixed(2)}</td>
      <td>₹${(i.qty * i.price).toFixed(2)}</td>
    </tr>
  `).join('');

  const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
  const delivery = subtotal >= 299 ? 0 : 40;
  const grandTotal = parseFloat(order.total);

  document.title = `Invoice #${order.id} — Sitaram Medical Store`;

  content.innerHTML = `
    <div class="invoice">
      <div class="inv-header">
        <div>
          <div class="inv-logo-name">💊 Sitaram Medical Store</div>
          <div class="inv-logo-sub">Chemist & Druggist</div>
          <div class="inv-logo-addr">Old Bus Stand, Opp. of Jio Mart<br>Digapahandi-761012, Ganjam, Odisha<br>📞 78468 70485 | 88988 70485</div>
        </div>
        <div class="inv-title">
          <h2>INVOICE</h2>
          <div class="inv-num">#${order.id}</div>
        </div>
      </div>

      <div class="inv-body">
        <div class="inv-meta">
          <div class="meta-block">
            <label>Bill To</label>
            <p>${order.customer_name}</p>
            <small>${order.phone || ''}</small>
            <small style="margin-top:4px">${order.address || ''}</small>
          </div>
          <div class="meta-block" style="text-align:right">
            <label>Invoice Date</label>
            <p>${date}</p>
            <small>${time}</small>
            <label style="margin-top:12px">Payment</label>
            <p>${order.payment_method === 'online' ? '💳 Online' : '💵 Cash on Delivery'}</p>
          </div>
        </div>

        <table class="inv-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Medicine</th>
              <th style="text-align:center">Qty</th>
              <th style="text-align:right">Rate</th>
              <th style="text-align:right">Amount</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="inv-totals">
          <div class="totals-box">
            <div class="total-row"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
            <div class="total-row"><span>Delivery</span><span>${delivery === 0 ? 'FREE' : '₹' + delivery.toFixed(2)}</span></div>
            <div class="total-row grand"><span>Total</span><span>₹${grandTotal.toFixed(2)}</span></div>
          </div>
        </div>

        <div class="inv-status ${sc.cls}">${sc.icon} ${sc.label}</div>

        <div class="inv-footer">
          <p><strong>Thank you for shopping at Sitaram Medical Store!</strong></p>
          <p>This is a computer-generated invoice.<br>For queries: 78468 70485 | 88988 70485</p>
          <a class="track-link" href="/track.html?id=${order.id}">📦 Track This Order</a>
        </div>
      </div>
    </div>
  `;
}

loadInvoice();
</script>
</body>
</html>
