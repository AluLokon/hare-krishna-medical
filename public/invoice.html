<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice — Sitaram Medical Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #0f6b3a; --green-dark: #09421f; --green-mid: #138a4a;
      --green-light: #e3f4eb; --green-pale: #f1faf5;
      --text: #192b20; --muted: #6b7c72; --border: #ddeae2; --bg: #f3f9f5;
      --r: 14px; --r-sm: 10px;
    }
    body {
      font-family: 'Nunito', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .page-header {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(15,107,58,0.3);
    }
    .back-btn {
      color: white; text-decoration: none; font-size: 22px;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.15); transition: background 0.15s; flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .header-info { flex: 1; }
    .header-info strong { font-size: 17px; font-weight: 900; color: white; display: block; }
    .header-info span { font-size: 12px; color: rgba(255,255,255,0.78); font-weight: 600; }
    .print-btn {
      background: rgba(255,255,255,0.18);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.35);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .print-btn:hover { background: rgba(255,255,255,0.28); }

    .container { max-width: 650px; margin: 24px auto; padding: 0 16px 48px; }

    .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; font-weight: 500; }
    .error-box {
      background: #fff0f0; color: #dc2626;
      padding: 16px 20px; border-radius: var(--r); text-align: center;
      border: 1.5px solid #fca5a5; font-weight: 700;
    }

    /* Invoice card */
    .invoice {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(15,107,58,0.12);
      border: 1.5px solid var(--border);
    }

    /* Invoice top header */
    .inv-header {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      padding: 28px 28px 24px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .inv-brand-name { font-size: 20px; font-weight: 900; margin-bottom: 3px; }
    .inv-brand-type { font-size: 12px; opacity: 0.8; font-weight: 600; }
    .inv-brand-addr { font-size: 11.5px; opacity: 0.72; margin-top: 7px; line-height: 1.6; font-weight: 500; }
    .inv-title-block { text-align: right; flex-shrink: 0; }
    .inv-title-block h2 { font-size: 28px; font-weight: 900; letter-spacing: 1.5px; opacity: 0.95; }
    .inv-title-block .inv-num { font-size: 15px; font-weight: 800; margin-top: 4px; opacity: 0.85; }

    /* Invoice body */
    .inv-body { padding: 24px 28px; }

    /* Meta grid */
    .inv-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--green-light);
    }
    .meta-block {}
    .meta-block label {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
      display: block;
      margin-bottom: 5px;
    }
    .meta-block p { font-size: 14px; color: var(--text); font-weight: 800; line-height: 1.4; }
    .meta-block small { font-size: 12.5px; color: var(--muted); font-weight: 500; display: block; }
    .meta-right { text-align: right; }

    /* Items table */
    .inv-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .inv-table th {
      background: var(--green-pale);
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
      border-bottom: 2px solid var(--border);
    }
    .inv-table th:last-child, .inv-table td:last-child { text-align: right; }
    .inv-table td {
      padding: 12px;
      font-size: 13.5px;
      color: var(--text);
      border-bottom: 1px solid var(--green-pale);
      font-weight: 600;
    }
    .inv-table tr:last-child td { border-bottom: none; }
    .med-name { font-weight: 800; color: var(--text); }
    .med-brand { font-size: 11.5px; color: var(--muted); font-weight: 500; }

    /* Totals */
    .inv-totals { display: flex; justify-content: flex-end; }
    .totals-box { width: 230px; }
    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 13.5px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--green-pale);
    }
    .total-row.grand {
      font-size: 17px;
      font-weight: 900;
      color: var(--green);
      border-bottom: none;
      padding-top: 10px;
    }

    /* Status badge */
    .inv-status {
      margin-top: 20px;
      padding: 11px 16px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 800;
      text-align: center;
    }
    .status-pending    { background: #fef3c7; color: #92400e; }
    .status-confirmed  { background: #dbeafe; color: #1d4ed8; }
    .status-dispatched { background: #ede9fe; color: #6d28d9; }
    .status-delivered  { background: #d1fae5; color: #065f46; }
    .status-cancelled  { background: #fee2e2; color: #991b1b; }

    /* Footer / note */
    .inv-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px dashed var(--border);
      text-align: center;
    }
    .inv-footer p { font-size: 12.5px; color: var(--muted); line-height: 1.8; font-weight: 500; }
    .inv-footer strong { color: var(--text); font-weight: 800; }
    .track-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
      background: var(--green);
      color: white;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .track-link:hover { opacity: 0.9; }

    /* Print */
    @media print {
      body { background: white; }
      .page-header { display: none !important; }
      .container { margin: 0; padding: 0; max-width: 100%; }
      .invoice { box-shadow: none; border-radius: 0; border: none; }
      .track-link { display: none; }
    }

    /* Mobile */
    @media (max-width: 520px) {
      .container { margin: 16px auto; padding: 0 12px 36px; }
      .inv-header { flex-direction: column; gap: 14px; padding: 22px 20px; }
      .inv-title-block { text-align: left; }
      .inv-title-block h2 { font-size: 24px; }
      .inv-body { padding: 18px 16px; }
      .inv-meta { grid-template-columns: 1fr; gap: 14px; }
      .meta-right { text-align: left; }
      .totals-box { width: 100%; }
      .inv-table th { font-size: 10px; padding: 8px 10px; }
      .inv-table td { font-size: 12.5px; padding: 10px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <a class="back-btn" href="/">←</a>
  <div class="header-info">
    <strong>Invoice</strong>
    <span>Sitaram Medical Store</span>
  </div>
  <button class="print-btn" onclick="window.print()">🖨️ Print / PDF</button>
</div>

<div class="container">
  <div id="content"><div class="loading">⏳ Loading invoice...</div></div>
</div>

<script>
const statusMeta = {
  pending:    { label: 'Order Placed',    cls: 'status-pending',    icon: '📋' },
  confirmed:  { label: 'Confirmed',        cls: 'status-confirmed',  icon: '✅' },
  dispatched: { label: 'Out for Delivery', cls: 'status-dispatched', icon: '🚚' },
  delivered:  { label: 'Delivered',        cls: 'status-delivered',  icon: '🏠' },
  cancelled:  { label: 'Cancelled',        cls: 'status-cancelled',  icon: '❌' }
};

async function loadInvoice() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const content = document.getElementById('content');

  if (!orderId) {
    content.innerHTML = '<div class="error-box">No order ID provided. Please <a href="/" style="color:#0f6b3a;font-weight:800">go home</a> and open your order.</div>';
    return;
  }

  try {
    const res = await fetch(`/api/orders/${orderId}`);
    if (!res.ok) {
      const err = await res.json();
      content.innerHTML = `<div class="error-box">${err.error || 'Order not found.'}</div>`;
      return;
    }
    const order = await res.json();
    renderInvoice(order);
  } catch (e) {
    content.innerHTML = '<div class="error-box">Network error. Please try again.</div>';
  }
}

function renderInvoice(order) {
  const content = document.getElementById('content');
  const items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]');
  const date = new Date(order.created_at).toLocaleDateString('en-IN', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
  const time = new Date(order.created_at).toLocaleTimeString('en-IN', {
    hour: '2-digit', minute: '2-digit'
  });
  const status = (order.status || 'pending').toLowerCase();
  const sc = statusMeta[status] || statusMeta.pending;

  const rows = items.map((i, idx) => `
    <tr>
      <td>${idx + 1}</td>
      <td>
        <div class="med-name">${i.name}</div>
        ${i.brand ? `<div class="med-brand">${i.brand}</div>` : ''}
      </td>
      <td style="text-align:center;font-weight:800">${i.qty}</td>
      <td style="text-align:right">₹${parseFloat(i.price).toFixed(2)}</td>
      <td style="font-weight:800;color:#0f6b3a">₹${(i.qty * i.price).toFixed(2)}</td>
    </tr>
  `).join('');

  const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
  const delivery = subtotal >= 299 ? 0 : 40;
  const grandTotal = parseFloat(order.total);

  document.title = `Invoice #${order.id} — Sitaram Medical Store`;

  content.innerHTML = `
    <div class="invoice">
      <div class="inv-header">
        <div>
          <div class="inv-brand-name">💊 Sitaram Medical Store</div>
          <div class="inv-brand-type">Chemist & Druggist</div>
          <div class="inv-brand-addr">Old Bus Stand, Opp. of Jio Mart<br>Digapahandi-761012, Ganjam, Odisha<br>📞 78468 70485 | 88988 70485</div>
        </div>
        <div class="inv-title-block">
          <h2>INVOICE</h2>
          <div class="inv-num">#${order.id}</div>
        </div>
      </div>

      <div class="inv-body">
        <div class="inv-meta">
          <div class="meta-block">
            <label>Bill To</label>
            <p>${order.customer_name}</p>
            <small>${order.phone || ''}</small>
            <small style="margin-top:3px">${order.address || ''}</small>
          </div>
          <div class="meta-block meta-right">
            <label>Invoice Date</label>
            <p>${date}</p>
            <small>${time}</small>
            <label style="margin-top:14px">Payment Mode</label>
            <p>${order.payment_method === 'online' ? '💳 Online' : '💵 Cash on Delivery'}</p>
          </div>
        </div>

        <table class="inv-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Medicine</th>
              <th style="text-align:center">Qty</th>
              <th style="text-align:right">Rate</th>
              <th style="text-align:right">Amount</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="inv-totals">
          <div class="totals-box">
            <div class="total-row"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
            <div class="total-row"><span>Delivery</span><span>${delivery === 0 ? '🎉 FREE' : '₹' + delivery.toFixed(2)}</span></div>
            <div class="total-row grand"><span>Grand Total</span><span>₹${grandTotal.toFixed(2)}</span></div>
          </div>
        </div>

        <div class="inv-status ${sc.cls}">${sc.icon} ${sc.label}</div>

        <div class="inv-footer">
          <p><strong>Thank you for shopping at Sitaram Medical Store!</strong></p>
          <p>This is a computer-generated invoice. No signature required.<br>
          For queries: 📞 78468 70485 | 88988 70485</p>
          <a class="track-link" href="/track.html?id=${order.id}">📦 Track This Order</a>
        </div>
      </div>
    </div>`;
}

loadInvoice();
</script>
</body>
</html>
