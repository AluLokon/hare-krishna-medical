<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — Sitaram Medical Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #0f6b3a; --green-dark: #09421f; --green-mid: #138a4a;
      --green-light: #e3f4eb; --green-pale: #f1faf5;
      --text: #192b20; --muted: #6b7c72; --border: #ddeae2; --bg: #f3f9f5;
      --r: 14px; --r-sm: 10px;
    }
    body {
      font-family: 'Nunito', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .page-header {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(15,107,58,0.3);
    }
    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 22px;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.15);
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .header-info { flex: 1; }
    .header-info strong { font-size: 17px; font-weight: 900; color: white; display: block; }
    .header-info span { font-size: 12px; color: rgba(255,255,255,0.78); font-weight: 600; }

    .container { max-width: 500px; margin: 0 auto; padding: 20px 16px 48px; }

    /* Search card */
    .search-card {
      background: white;
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: 0 2px 14px rgba(15,107,58,0.1);
      margin-bottom: 20px;
      border: 1.5px solid var(--border);
    }
    .search-card h2 { font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
    .search-card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; font-weight: 500; line-height: 1.5; }

    .input-row { display: flex; gap: 10px; }
    .input-row input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: var(--r-sm);
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      outline: none;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .input-row input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(15,107,58,0.1);
    }
    .track-btn {
      padding: 12px 20px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: var(--r-sm);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .track-btn:hover { background: var(--green-mid); }
    .track-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .error-msg {
      background: #fff0f0;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      border: 1px solid #fca5a5;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Order result card */
    .order-result { display: none; }
    .order-result.show { display: block; }

    .result-card {
      background: white;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(15,107,58,0.1);
    }

    .result-header {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      padding: 20px;
      color: white;
    }
    .result-header .oid-label { font-size: 11.5px; opacity: 0.82; font-weight: 700; margin-bottom: 3px; }
    .result-header .oid-num { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; }
    .result-header .oid-date { font-size: 12px; opacity: 0.78; margin-top: 4px; font-weight: 500; }

    .result-body { padding: 20px; }

    /* Cancelled banner */
    .cancelled-banner {
      background: #fff0f0;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 18px;
      border: 1px solid #fca5a5;
    }

    /* Timeline */
    .timeline { margin-bottom: 22px; }
    .tl-title { font-size: 13.5px; font-weight: 900; color: var(--text); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.03em; }

    .tl-step {
      display: flex;
      gap: 14px;
      position: relative;
    }
    .tl-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px; top: 33px;
      width: 2px;
      height: calc(100% - 10px);
      background: var(--border);
    }
    .tl-step.done:not(:last-child)::after { background: var(--green); }

    .tl-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      z-index: 1;
      position: relative;
    }
    .tl-step.done .tl-dot { background: var(--green); }
    .tl-step.active .tl-dot {
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(15,107,58,0.18);
    }
    .tl-info { padding-bottom: 20px; flex: 1; }
    .tl-label { font-size: 14px; font-weight: 800; color: var(--muted); }
    .tl-step.done .tl-label, .tl-step.active .tl-label { color: var(--green); }
    .tl-desc { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .tl-time { font-size: 11.5px; color: #b0c4b8; margin-top: 3px; font-weight: 600; }

    /* Items section */
    .items-sec {
      border-top: 1.5px solid var(--green-light);
      padding-top: 16px;
      margin-bottom: 16px;
    }
    .items-title { font-size: 13.5px; font-weight: 900; color: var(--text); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
    .order-item {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
      color: #4b5563;
      padding: 7px 0;
      border-bottom: 1px solid #f0f9f4;
    }
    .order-item:last-child { border-bottom: none; }
    .order-item span:last-child { font-weight: 800; color: var(--text); }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 900;
      color: var(--green);
      padding-top: 10px;
      border-top: 2px solid var(--green-light);
    }

    /* Rx badge */
    .rx-info {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .rx-review  { background: #fef3c7; color: #92400e; }
    .rx-approved { background: #d1fae5; color: #065f46; }
    .rx-rejected { background: #fee2e2; color: #991b1b; }

    /* Action buttons */
    .result-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .result-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      border: 1.5px solid var(--border);
      color: var(--text);
      background: var(--bg);
      transition: all 0.15s;
      cursor: pointer;
      font-family: inherit;
    }
    .result-action:hover { border-color: var(--green); color: var(--green); background: var(--green-pale); }
    .result-action.primary { background: var(--green); color: white; border-color: var(--green); }
    .result-action.primary:hover { background: var(--green-mid); }

    /* Contact */
    .contact-box {
      background: var(--green-pale);
      border-radius: 11px;
      padding: 14px;
      text-align: center;
      border: 1.5px solid var(--border);
    }
    .contact-box p { font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
    .contact-box a { color: var(--green); font-weight: 800; font-size: 14px; text-decoration: none; }
    .contact-box a:hover { text-decoration: underline; }

    @media (max-width: 400px) {
      .container { padding: 14px 12px 40px; }
      .result-header .oid-num { font-size: 26px; }
      .result-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <a class="back-btn" href="/">←</a>
  <div class="header-info">
    <strong>Track Your Order</strong>
    <span>Sitaram Medical Store</span>
  </div>
</div>

<div class="container">
  <div class="search-card">
    <h2>🔍 Track Order</h2>
    <p>Enter your Order ID to check the live status of your delivery.</p>
    <div class="input-row">
      <input type="number" id="orderIdInput" placeholder="Enter Order ID (e.g. 42)"
        onkeypress="if(event.key==='Enter')trackOrder()">
      <button class="track-btn" id="trackBtn" onclick="trackOrder()">Track</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="order-result" id="orderResult"></div>
</div>

<script>
async function trackOrder() {
  const input = document.getElementById('orderIdInput').value.trim();
  const errorEl = document.getElementById('errorMsg');
  const result = document.getElementById('orderResult');
  const btn = document.getElementById('trackBtn');

  errorEl.classList.remove('show');
  result.classList.remove('show');

  if (!input || isNaN(input)) {
    errorEl.textContent = 'Please enter a valid Order ID.';
    errorEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = '...';

  try {
    const res = await fetch(`/api/orders/${input}`);
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Order not found. Please check your Order ID.';
      errorEl.classList.add('show');
      return;
    }
    renderOrder(data);
    result.classList.add('show');
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Track';
  }
}

function renderOrder(order) {
  const result = document.getElementById('orderResult');
  const status = order.status || 'pending';
  const items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]');
  const date = new Date(order.created_at).toLocaleDateString('en-IN', {
    day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const steps = [
    { key: 'pending',    icon: '📋', label: 'Order Placed',       desc: 'Your order has been received',       time: order.created_at },
    { key: 'confirmed',  icon: '✅', label: 'Confirmed',           desc: 'Store has confirmed your order',     time: order.confirmed_at },
    { key: 'dispatched', icon: '🚚', label: 'Out for Delivery',    desc: 'Your order is on the way',           time: order.dispatched_at },
    { key: 'delivered',  icon: '🏠', label: 'Delivered',           desc: 'Order delivered successfully',       time: order.delivered_at }
  ];

  const statusOrder = ['pending', 'confirmed', 'dispatched', 'delivered'];
  const currentIdx = statusOrder.indexOf(status);
  const isCancelled = status === 'cancelled';

  const stepsHtml = steps.map((step, i) => {
    let cls = '';
    if (isCancelled) { cls = i === 0 ? 'done' : ''; }
    else { if (i < currentIdx) cls = 'done'; else if (i === currentIdx) cls = 'active done'; }
    const timeStr = step.time
      ? new Date(step.time).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      : '';
    return `<div class="tl-step ${cls}">
      <div class="tl-dot">${cls ? step.icon : ''}</div>
      <div class="tl-info">
        <div class="tl-label">${step.label}</div>
        <div class="tl-desc">${step.desc}</div>
        ${timeStr ? `<div class="tl-time">${timeStr}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const itemsHtml = items.map(i =>
    `<div class="order-item"><span>${i.name} × ${i.qty}</span><span>₹${(i.qty * i.price).toFixed(2)}</span></div>`
  ).join('');

  let rxHtml = '';
  if (order.prescription_status) {
    const cls = order.prescription_status === 'approved' ? 'rx-approved' : order.prescription_status === 'rejected' ? 'rx-rejected' : 'rx-review';
    const txt = order.prescription_status === 'approved' ? '✅ Prescription Approved' : order.prescription_status === 'rejected' ? '❌ Prescription Rejected' : '⏳ Prescription Under Review';
    rxHtml = `<div class="rx-info ${cls}">${txt}</div>`;
  }

  result.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="oid-label">Order ID</div>
        <div class="oid-num">#${order.id}</div>
        <div class="oid-date">Placed on ${date}</div>
      </div>
      <div class="result-body">
        ${isCancelled ? '<div class="cancelled-banner">❌ This order has been cancelled</div>' : ''}
        ${rxHtml}
        <div class="timeline">
          <div class="tl-title">Order Status</div>
          ${stepsHtml}
        </div>
        <div class="items-sec">
          <div class="items-title">Items Ordered</div>
          ${itemsHtml}
          <div class="order-total-row"><span>Total</span><span>₹${parseFloat(order.total).toFixed(2)}</span></div>
        </div>
        <div class="result-actions">
          <a class="result-action" href="/invoice.html?id=${order.id}">🧾 Invoice</a>
          <a class="result-action primary" href="/">🛒 Shop More</a>
        </div>
        <div class="contact-box">
          <p>Need help with your order?</p>
          <a href="tel:7846870485">📞 78468 70485</a> &nbsp;|&nbsp;
          <a href="tel:8898870485">📞 88988 70485</a>
        </div>
      </div>
    </div>`;
}

// Auto-track from URL
const urlId = new URLSearchParams(window.location.search).get('id');
if (urlId) {
  document.getElementById('orderIdInput').value = urlId;
  trackOrder();
}
</script>
</body>
</html>
