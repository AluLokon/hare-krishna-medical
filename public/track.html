<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — Sitaram Medical Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f7fa; min-height: 100vh; }

    .header {
      background: linear-gradient(135deg, #0f6b3a, #1a9b56);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header a { color: white; text-decoration: none; font-size: 20px; }
    .header-title { color: white; }
    .header-title strong { font-size: 17px; display: block; }
    .header-title span { font-size: 12px; opacity: 0.85; }

    .container { max-width: 500px; margin: 0 auto; padding: 20px 16px; }

    .search-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .search-card h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 6px; }
    .search-card p { font-size: 13px; color: #6b7280; margin-bottom: 16px; }

    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      color: #1a1a2e;
      transition: border-color 0.2s;
    }
    .input-row input:focus { border-color: #0f6b3a; }
    .track-btn {
      padding: 12px 20px;
      background: #0f6b3a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .track-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Order result card */
    .order-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      display: none;
    }
    .order-card.show { display: block; }

    .order-card-header {
      background: linear-gradient(135deg, #0f6b3a, #1a9b56);
      padding: 20px;
      color: white;
    }
    .order-id-label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
    .order-id-num { font-size: 28px; font-weight: 800; }
    .order-date { font-size: 12px; opacity: 0.8; margin-top: 4px; }

    .order-card-body { padding: 20px; }

    /* Status timeline */
    .timeline { margin-bottom: 24px; }
    .timeline-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 16px; }

    .timeline-steps { position: relative; }
    .timeline-step {
      display: flex;
      gap: 14px;
      margin-bottom: 0;
      position: relative;
    }
    .timeline-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      width: 2px;
      height: calc(100% - 8px);
      background: #e5e7eb;
    }
    .timeline-step.done:not(:last-child)::after { background: #0f6b3a; }

    .step-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      z-index: 1;
      position: relative;
    }
    .timeline-step.done .step-icon { background: #0f6b3a; }
    .timeline-step.active .step-icon { background: #0f6b3a; box-shadow: 0 0 0 4px #d1fae5; }

    .step-content { padding-bottom: 20px; flex: 1; }
    .step-label { font-size: 14px; font-weight: 600; color: #374151; }
    .timeline-step.done .step-label, .timeline-step.active .step-label { color: #0f6b3a; }
    .step-time { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .step-desc { font-size: 12px; color: #6b7280; margin-top: 3px; }

    /* Order items */
    .items-section { border-top: 1px solid #f3f4f6; padding-top: 16px; margin-bottom: 16px; }
    .items-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 10px; }
    .order-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #4b5563;
      padding: 6px 0;
      border-bottom: 1px solid #f9fafb;
    }
    .order-item:last-child { border-bottom: none; }
    .order-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
      padding-top: 10px;
      border-top: 2px solid #f3f4f6;
    }

    /* Prescription badge */
    .rx-badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .rx-approved { background: #d1fae5; color: #065f46; }
    .rx-rejected { background: #fee2e2; color: #991b1b; }

    .contact-section {
      background: #f9fafb;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-top: 16px;
    }
    .contact-section p { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
    .contact-section a {
      color: #0f6b3a;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }

    .cancelled-banner {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="header">
  <a href="/">←</a>
  <div class="header-title">
    <strong>Track Your Order</strong>
    <span>Sitaram Medical Store</span>
  </div>
</div>

<div class="container">
  <div class="search-card">
    <h2>🔍 Track Order</h2>
    <p>Enter your Order ID to check the current status of your order.</p>
    <div class="input-row">
      <input type="number" id="orderIdInput" placeholder="Enter Order ID (e.g. 42)"
        onkeypress="if(event.key==='Enter')trackOrder()">
      <button class="track-btn" id="trackBtn" onclick="trackOrder()">Track</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="order-card" id="orderCard"></div>
</div>

<script>
async function trackOrder() {
  const input = document.getElementById('orderIdInput').value.trim();
  const errorEl = document.getElementById('errorMsg');
  const card = document.getElementById('orderCard');
  const btn = document.getElementById('trackBtn');

  errorEl.classList.remove('show');
  card.classList.remove('show');

  if (!input || isNaN(input)) {
    errorEl.textContent = 'Please enter a valid Order ID.';
    errorEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Tracking...';

  try {
    const res = await fetch(`/api/orders/${input}`);
    const data = await res.json();

    if (!res.ok) {
      errorEl.textContent = data.error || 'Order not found. Please check your Order ID.';
      errorEl.classList.add('show');
      return;
    }

    renderOrderCard(data);
    card.classList.add('show');

  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Track';
  }
}

function renderOrderCard(order) {
  const card = document.getElementById('orderCard');
  const status = order.status || 'pending';
  const items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]');
  const date = new Date(order.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  const steps = [
    {
      key: 'pending',
      icon: '📋',
      label: 'Order Placed',
      desc: 'Your order has been received',
      time: order.created_at
    },
    {
      key: 'confirmed',
      icon: '✅',
      label: 'Order Confirmed',
      desc: 'Store has confirmed your order',
      time: order.confirmed_at
    },
    {
      key: 'dispatched',
      icon: '🚚',
      label: 'Out for Delivery',
      desc: 'Your order is on the way',
      time: order.dispatched_at
    },
    {
      key: 'delivered',
      icon: '🏠',
      label: 'Delivered',
      desc: 'Order delivered successfully',
      time: order.delivered_at
    }
  ];

  const statusOrder = ['pending', 'confirmed', 'dispatched', 'delivered'];
  const currentIdx = statusOrder.indexOf(status);
  const isCancelled = status === 'cancelled';

  const stepsHtml = steps.map((step, i) => {
    let cls = '';
    if (isCancelled) {
      cls = i === 0 ? 'done' : '';
    } else {
      if (i < currentIdx) cls = 'done';
      else if (i === currentIdx) cls = 'active done';
    }
    const timeStr = step.time ? new Date(step.time).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    return `
      <div class="timeline-step ${cls}">
        <div class="step-icon">${cls ? step.icon : '○'}</div>
        <div class="step-content">
          <div class="step-label">${step.label}</div>
          <div class="step-desc">${step.desc}</div>
          ${timeStr ? `<div class="step-time">${timeStr}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const itemsHtml = items.map(i =>
    `<div class="order-item">
      <span>${i.name} × ${i.qty}</span>
      <span>₹${(i.qty * i.price).toFixed(2)}</span>
    </div>`
  ).join('');

  let rxHtml = '';
  if (order.prescription_status) {
    const rxClass = order.prescription_status === 'approved' ? 'rx-approved' : order.prescription_status === 'rejected' ? 'rx-rejected' : '';
    const rxText = order.prescription_status === 'approved' ? '✅ Prescription Approved' : order.prescription_status === 'rejected' ? '❌ Prescription Rejected' : '⏳ Prescription Under Review';
    rxHtml = `<div class="rx-badge ${rxClass}">${rxText}</div>`;
  }

  card.innerHTML = `
    <div class="order-card-header">
      <div class="order-id-label">Order ID</div>
      <div class="order-id-num">#${order.id}</div>
      <div class="order-date">Placed on ${date}</div>
    </div>
    <div class="order-card-body">
      ${isCancelled ? '<div class="cancelled-banner">❌ This order has been cancelled</div>' : ''}
      ${rxHtml}
      <div class="timeline">
        <div class="timeline-title">Order Status</div>
        <div class="timeline-steps">${stepsHtml}</div>
      </div>
      <div class="items-section">
        <div class="items-title">Items Ordered</div>
        ${itemsHtml}
        <div class="order-total-row">
          <span>Total</span>
          <span>₹${parseFloat(order.total).toFixed(2)}</span>
        </div>
      </div>
      <div style="margin-bottom:16px;text-align:center">
        <a href="/invoice.html?id=${order.id}"
          style="display:inline-block;background:#f0faf5;color:#0f6b3a;border:2px solid #0f6b3a;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none">
          🧾 Download Invoice
        </a>
      </div>
      <div class="contact-section">
        <p>Need help with your order?</p>
        <a href="tel:7846870485">📞 78468 70485</a> &nbsp;|&nbsp;
        <a href="tel:8898870485">📞 88988 70485</a>
      </div>
    </div>`;
}

// Auto-track if order ID in URL: track.html?id=42
const urlParams = new URLSearchParams(window.location.search);
const urlId = urlParams.get('id');
if (urlId) {
  document.getElementById('orderIdInput').value = urlId;
  trackOrder();
}
</script>
</body>
</html>
