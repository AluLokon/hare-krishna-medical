<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Sitaram Medical Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; }

    header {
      background: linear-gradient(135deg, #085041, #1D9E75);
      color: white; padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-left a { color: white; text-decoration: none; font-size: 13px; opacity: 0.85; }
    .header-left a:hover { opacity: 1; }
    header h1 { font-size: 18px; }

    .container { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* Auth tabs */
    .auth-tabs {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border: 1px solid #ddd; border-radius: 10px; overflow: hidden;
    }
    .auth-tab {
      flex: 1; padding: 0.75rem; text-align: center;
      background: white; border: none; cursor: pointer;
      font-size: 14px; font-weight: 500; font-family: inherit;
      color: #777; transition: all 0.15s;
    }
    .auth-tab.active { background: #3B6D11; color: white; }

    /* Forms */
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-card {
      background: white; border-radius: 12px;
      padding: 1.5rem; border: 1px solid #e8e8e8;
    }
    .form-card h2 { font-size: 18px; margin-bottom: 4px; }
    .form-card p { font-size: 13px; color: #777; margin-bottom: 1.25rem; }

    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    .form-group input {
      width: 100%; padding: 0.6rem 0.85rem; border-radius: 8px;
      border: 1px solid #ddd; font-size: 14px; font-family: inherit;
    }
    .form-group input:focus { outline: 2px solid #9FE1CB; border-color: transparent; }

    .submit-btn {
      width: 100%; padding: 0.8rem; background: #3B6D11;
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      font-family: inherit; margin-top: 4px;
    }
    .submit-btn:hover { background: #2d5509; }
    .error-msg { color: #A32D2D; font-size: 13px; margin-top: 8px; }
    .success-msg { color: #27500A; font-size: 13px; margin-top: 8px; }

    /* Dashboard */
    .dashboard { display: none; }
    .welcome-card {
      background: white; border-radius: 12px; padding: 1.25rem;
      border: 1px solid #e8e8e8; margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .welcome-name { font-size: 17px; font-weight: 500; }
    .welcome-email { font-size: 12px; color: #777; margin-top: 2px; }
    .logout-btn {
      background: #FCEBEB; color: #A32D2D; border: 1px solid #F7C1C1;
      padding: 6px 14px; border-radius: 8px; font-size: 13px;
      cursor: pointer; font-family: inherit;
    }

    /* Address card */
    .section-card {
      background: white; border-radius: 12px; padding: 1.25rem;
      border: 1px solid #e8e8e8; margin-bottom: 1rem;
    }
    .section-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 1rem; }
    .address-display { font-size: 13px; color: #555; line-height: 1.6; }
    .edit-address-btn {
      background: #EAF3DE; color: #3B6D11; border: 1px solid #C0DD97;
      padding: 5px 12px; border-radius: 6px; font-size: 12px;
      cursor: pointer; font-family: inherit; margin-top: 8px;
    }
    .address-form { display: none; margin-top: 10px; }
    .address-form textarea {
      width: 100%; padding: 0.6rem 0.85rem; border-radius: 8px;
      border: 1px solid #ddd; font-size: 14px; font-family: inherit;
      resize: vertical; min-height: 80px;
    }
    .save-address-btn {
      background: #3B6D11; color: white; border: none;
      padding: 6px 16px; border-radius: 6px; font-size: 13px;
      cursor: pointer; font-family: inherit; margin-top: 8px;
    }

    /* Orders */
    .order-card {
      background: white; border-radius: 12px; padding: 1rem;
      border: 1px solid #e8e8e8; margin-bottom: 10px;
    }
    .order-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 10px;
    }
    .order-id { font-size: 12px; color: #777; }
    .order-date { font-size: 12px; color: #777; }
    .order-status {
      font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 500;
    }
    .status-pending { background: #FAEEDA; color: #633806; }
    .status-confirmed { background: #E6F1FB; color: #0C447C; }
    .status-dispatched { background: #EEEDFE; color: #534AB7; }
    .status-delivered { background: #EAF3DE; color: #27500A; }

    .order-items { font-size: 13px; color: #555; margin-bottom: 8px; }
    .order-item-row { padding: 3px 0; }
    .order-total { font-size: 15px; font-weight: 500; color: #3B6D11; }

    /* Progress bar */
    .progress-bar {
      display: flex; align-items: center; gap: 4px; margin: 10px 0;
    }
    .progress-step {
      flex: 1; text-align: center;
    }
    .step-circle {
      width: 22px; height: 22px; border-radius: 50%; margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 500;
    }
    .step-done { background: #3B6D11; color: white; }
    .step-pending { background: #e8e8e8; color: #888; }
    .step-label { font-size: 10px; margin-top: 3px; color: #888; }
    .step-label.done { color: #3B6D11; }
    .progress-line { flex: 2; height: 2px; margin-bottom: 16px; }
    .line-done { background: #3B6D11; }
    .line-pending { background: #e8e8e8; }

    .no-orders {
      text-align: center; padding: 2rem; color: #888; font-size: 14px;
    }
    .shop-btn {
      display: inline-block; margin-top: 1rem; background: #3B6D11;
      color: white; padding: 8px 20px; border-radius: 8px;
      text-decoration: none; font-size: 14px;
    }

    @media (max-width: 600px) {
      .container { padding: 1rem 0.75rem; }
      .form-card { padding: 1.25rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <h1>🏥 My Account</h1>
      <a href="/">← Back to Store</a>
    </div>
  </div>
</header>

<div class="container">

  <!-- Auth Section (shown when not logged in) -->
  <div id="authSection">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('login')">Login</button>
      <button class="auth-tab" onclick="showTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div class="auth-form active" id="loginForm">
      <div class="form-card">
        <h2>Welcome back!</h2>
        <p>Login to see your order history</p>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="loginEmail" placeholder="yourname@gmail.com"
            onkeydown="if(event.key==='Enter') login()">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Your password"
            onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="submit-btn" onclick="login()">Login</button>
        <div id="loginError" class="error-msg"></div>
      </div>
    </div>

    <!-- Register Form -->
    <div class="auth-form" id="registerForm">
      <div class="form-card">
        <h2>Create account</h2>
        <p>Register to track your orders easily</p>
        <div class="form-group">
          <label>Full name *</label>
          <input type="text" id="regName" placeholder="e.g. Ramesh Kumar">
        </div>
        <div class="form-group">
          <label>Phone number *</label>
          <input type="tel" id="regPhone" placeholder="10 digit mobile number">
        </div>
        <div class="form-group">
          <label>Email address *</label>
          <input type="email" id="regEmail" placeholder="yourname@gmail.com">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="regPassword" placeholder="Minimum 6 characters">
        </div>
        <div class="form-group">
          <label>Delivery address (optional)</label>
          <input type="text" id="regAddress" placeholder="House no., street, landmark...">
        </div>
        <button class="submit-btn" onclick="register()">Create Account</button>
        <div id="registerError" class="error-msg"></div>
        <div id="registerSuccess" class="success-msg"></div>
      </div>
    </div>
  </div>

  <!-- Dashboard (shown when logged in) -->
  <div class="dashboard" id="dashboard">

    <!-- Welcome -->
    <div class="welcome-card">
      <div>
        <div class="welcome-name" id="welcomeName">Hi!</div>
        <div class="welcome-email" id="welcomeEmail"></div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Saved Address -->
    <div class="section-card">
      <h3>📍 Saved Address</h3>
      <div class="address-display" id="addressDisplay">No address saved yet.</div>
      <button class="edit-address-btn" onclick="toggleAddressForm()">✏️ Edit Address</button>
      <div class="address-form" id="addressForm">
        <textarea id="addressInput" placeholder="Enter your delivery address..."></textarea>
        <button class="save-address-btn" onclick="saveAddress()">Save Address</button>
        <div id="addressMsg" style="font-size:13px;margin-top:6px"></div>
      </div>
    </div>

    <!-- Order History -->
    <div class="section-card">
      <h3>📦 My Orders</h3>
      <div id="orderHistory"><p style="color:#888;font-size:14px">Loading orders...</p></div>
    </div>

  </div>
</div>

<script>
  let customerToken = localStorage.getItem('customerToken');
  let customerData = JSON.parse(localStorage.getItem('customerData') || 'null');

  // Check if already logged in
  window.onload = function() {
    if (customerToken && customerData) {
      showDashboard();
    }
  };

  // Switch between login and register tabs
  function showTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.getElementById(tab + 'Form').classList.add('active');
    event.target.classList.add('active');
  }

  // Login
  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    if (!email || !password) {
      errorEl.textContent = 'Please enter email and password.';
      return;
    }

    try {
      const res = await fetch('/api/customers/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error || 'Login failed.';
        return;
      }

      customerToken = data.token;
      customerData = data.customer;
      localStorage.setItem('customerToken', customerToken);
      localStorage.setItem('customerData', JSON.stringify(customerData));
      showDashboard();

    } catch (err) {
      errorEl.textContent = 'Cannot connect to server.';
    }
  }

  // Register
  async function register() {
    const name     = document.getElementById('regName').value.trim();
    const phone    = document.getElementById('regPhone').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const address  = document.getElementById('regAddress').value.trim();
    const errorEl  = document.getElementById('registerError');
    const successEl = document.getElementById('registerSuccess');
    errorEl.textContent = '';
    successEl.textContent = '';

    if (!name || !phone || !email || !password) {
      errorEl.textContent = 'Please fill all required fields.';
      return;
    }

    try {
      const res = await fetch('/api/customers/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, password, address })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.errors
          ? data.errors[0].msg
          : data.error || 'Registration failed.';
        return;
      }

      customerToken = data.token;
      customerData = data.customer;
      localStorage.setItem('customerToken', customerToken);
      localStorage.setItem('customerData', JSON.stringify(customerData));
      successEl.textContent = 'Account created successfully! Redirecting...';
      setTimeout(() => showDashboard(), 1000);

    } catch (err) {
      errorEl.textContent = 'Cannot connect to server.';
    }
  }

  // Logout
  function logout() {
    localStorage.removeItem('customerToken');
    localStorage.removeItem('customerData');
    customerToken = null;
    customerData = null;
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }

  // Show dashboard after login
  function showDashboard() {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('welcomeName').textContent = `Hi, ${customerData.name}! 👋`;
    document.getElementById('welcomeEmail').textContent = customerData.email;

    // Show saved address
    if (customerData.address) {
      document.getElementById('addressDisplay').textContent = customerData.address;
      document.getElementById('addressInput').value = customerData.address;
    }

    loadOrderHistory();
  }

  // Load order history
  async function loadOrderHistory() {
    try {
      const res = await fetch('/api/customers/orders', {
        headers: { 'Authorization': `Bearer ${customerToken}` }
      });

      if (res.status === 401 || res.status === 403) {
        logout();
        return;
      }

      const orders = await res.json();
      renderOrderHistory(orders);

    } catch (err) {
      document.getElementById('orderHistory').innerHTML =
        '<p style="color:red;font-size:14px">Failed to load orders.</p>';
    }
  }

  // Render order history
  function renderOrderHistory(orders) {
    const container = document.getElementById('orderHistory');

    if (!orders.length) {
      container.innerHTML = `
        <div class="no-orders">
          <div style="font-size:36px;margin-bottom:0.5rem">📭</div>
          <p>No orders yet.</p>
          <a href="/" class="shop-btn">Start Shopping</a>
        </div>`;
      return;
    }

    const steps = ['pending', 'confirmed', 'dispatched', 'delivered'];

    container.innerHTML = orders.map(order => {
      const items = Array.isArray(order.items)
        ? order.items
        : JSON.parse(order.items || '[]');

      const date = new Date(order.created_at).toLocaleString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });

      const currentStep = steps.indexOf(order.status);

      const progressBar = `
        <div class="progress-bar">
          ${steps.map((step, i) => `
            <div class="progress-step">
              <div class="step-circle ${i <= currentStep ? 'step-done' : 'step-pending'}">
                ${i <= currentStep ? '✓' : i + 1}
              </div>
              <div class="step-label ${i <= currentStep ? 'done' : ''}">${step}</div>
            </div>
            ${i < steps.length - 1 ? `
              <div class="progress-line ${i < currentStep ? 'line-done' : 'line-pending'}"></div>
            ` : ''}
          `).join('')}
        </div>`;

      const statusClass = `status-${order.status}`;

      return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${order.id}</div>
              <div class="order-date">${date}</div>
            </div>
            <span class="order-status ${statusClass}">${order.status}</span>
          </div>
          ${progressBar}
          <div class="order-items">
            ${items.map(i => `
              <div class="order-item-row">
                💊 ${i.name} × ${i.qty} = ₹${(i.qty * i.price).toFixed(2)}
              </div>`).join('')}
          </div>
          <div class="order-total">Total: ₹${parseFloat(order.total).toFixed(2)}</div>
        </div>`;
    }).join('');
  }

  // Toggle address form
  function toggleAddressForm() {
    const form = document.getElementById('addressForm');
    form.style.display = form.style.display === 'none' || !form.style.display
      ? 'block' : 'none';
  }

  // Save address
  async function saveAddress() {
    const address = document.getElementById('addressInput').value.trim();
    const msg = document.getElementById('addressMsg');

    if (!address) {
      msg.style.color = '#A32D2D';
      msg.textContent = 'Please enter an address.';
      return;
    }

    try {
      const res = await fetch('/api/customers/address', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${customerToken}`
        },
        body: JSON.stringify({ address })
      });

      if (!res.ok) throw new Error();

      customerData.address = address;
      localStorage.setItem('customerData', JSON.stringify(customerData));
      document.getElementById('addressDisplay').textContent = address;
      document.getElementById('addressForm').style.display = 'none';
      msg.style.color = '#27500A';
      msg.textContent = '✓ Address saved!';

    } catch (err) {
      msg.style.color = '#A32D2D';
      msg.textContent = 'Failed to save address.';
    }
  }
</script>

</body>
</html>
